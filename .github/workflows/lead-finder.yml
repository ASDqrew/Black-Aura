name: Beauty Lead Finder

on:
  push:
    branches: [main]
    paths:
      - "tools/lead_finder/**"
      - ".github/workflows/lead-finder.yml"
  schedule:
    # 12:00 Asia/Yekaterinburg, Monday through Friday.
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore last successful database
        uses: actions/cache/restore@v4
        with:
          path: .lead-cache
          key: beauty-source-${{ github.run_id }}
          restore-keys: beauty-source-

      - name: Install city extract reader
        run: python3 -m pip install osmium==4.1.1

      - name: Find and rank Moscow beauty leads
        shell: bash
        run: |
          set -o pipefail
          mkdir -p lead-output
          python3 tools/lead_finder/lead_finder.py \
            --research tools/lead_finder/research.json \
            --cache .lead-cache/moscow.json \
            --min-score 50 --limit 100 \
            --output-dir lead-output 2>&1 | tee lead-output/search.log

      - name: Upload search diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lead-search-error
          path: lead-output/search.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save successful database
        uses: actions/cache/save@v4
        with:
          path: .lead-cache
          key: beauty-source-${{ github.run_id }}

      - name: Add run summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          import json
          from collections import Counter
          with open("lead-output/leads.csv", encoding="utf-8-sig") as handle:
              rows = list(csv.DictReader(handle))
          counts = Counter(row["priority"] for row in rows)
          print("## Beauty Lead Finder")
          with open("lead-output/status.json", encoding="utf-8") as handle:
              status = json.load(handle)
          if status["source"] == "cache":
              print(f"⚠ Источники недоступны. Использована сохранённая база от {status['fetched_at']}; это не новый поиск.")
          print(f"Найдено лидов: **{len(rows)}**")
          print(f"Приоритет A: **{counts['A']}**, B: **{counts['B']}**, C: **{counts['C']}**")
          print("Скачайте artifact `beauty-leads-moscow`: внутри таблица CSV и HTML-отчёт с готовыми сообщениями.")
          PY

      - name: Upload lead report
        uses: actions/upload-artifact@v4
        with:
          name: beauty-leads-moscow
          path: lead-output/
          retention-days: 7

